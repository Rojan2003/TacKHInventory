# Builds the Vue frontend and publishes it to GitHub Pages.
#
# Activation (manual, one-time): Settings > Pages > "Build and deployment" > Source = "GitHub Actions".
# Until that switch is made, the legacy Pages build serves the repository root (now empty of index.html, so 404)
# and this workflow's deploy job is harmless (it uploads an artifact that Pages ignores).
#
# Configuration lives in repository *Variables* (Settings > Secrets and variables > Actions > Variables).
# They are PUBLIC values that end up in the browser bundle anyway, so they are deliberately NOT secrets:
#   VITE_API_BASE_URL     Apps Script web app URL (…/exec)
#   VITE_GOOGLE_CLIENT_ID OAuth 2.0 web client ID
#   VITE_BASE_PATH        "/" with a custom domain, "/TacKHInventory/" for the default project URL
#   PAGES_CNAME           (optional) custom domain, e.g. inventory.example.org  -> writes dist/CNAME
# No secret is ever read by this workflow, so nothing secret can leak into logs or the build.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Backend + frontend unit tests
        run: npm test

      - name: Typecheck and build
        env:
          VITE_API_MODE: http
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::Repository variable VITE_API_BASE_URL is not set"; exit 1; }
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "::error::Repository variable VITE_GOOGLE_CLIENT_ID is not set"; exit 1; }
          npm run build

      - name: Scan the build output for secrets
        run: npm run secrets:scan -- dist

      - name: Custom domain
        if: ${{ vars.PAGES_CNAME != '' }}
        run: echo "${{ vars.PAGES_CNAME }}" > dist/CNAME

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
